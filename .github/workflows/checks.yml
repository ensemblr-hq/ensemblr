name: Checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:
    inputs:
      run_scan:
        description: >-
          Run the react-doctor scan. Callers building a tag pass false — the
          scan diffs against master, which a release tag already is.
        type: boolean
        default: true

permissions:
  contents: read

# A pull request groups by its number, so pushing a fixup cancels the run it
# just superseded. Three pushes in a minute used to mean three full runs racing
# for the same runners, and the third one waiting behind the two nobody would
# read. Everything else groups by commit — which is unique — so a push to master
# and a release's `workflow_call` never queue behind an unrelated run.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, typecheck and test used to be three steps of one job, run twice over a
  # `[macos, ubuntu]` matrix — so the slowest leg was the sum of all three, and
  # Biome and tsc ran a second time on a platform that cannot make them disagree.
  # They are separate jobs now: the wall clock is the slowest single job rather
  # than the sum, and only the suite that actually reads `process.platform` pays
  # for a second operating system.
  #
  # All three run inside the flake's dev shell, the toolchain every contributor
  # develops in, so a check that passes locally is the check CI ran. The build
  # legs in release.yml and nightly.yml stay off it — see install-dependencies.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-dev-shell
      - name: Biome, Tailwind scale, i18n lint, hardcoded strings
        run: nix develop -c bun run check

  # `bun run typecheck` fans out to every workspace; the desktop app's runs its
  # four tsconfig projects concurrently (apps/desktop/scripts/typecheck.mjs).
  # They each `include` `src`, so chaining them with
  # `&&` type-checked the bulk of the program four times in a row.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-dev-shell
      - name: Type check
        run: nix develop -c bun run typecheck

  # Both platforms Ensemblr ships for. The keymap suites resolve `mod` to ⌘ on
  # darwin and Ctrl elsewhere and assert whichever the runner is, so the Linux
  # leg is what proves a darwin-only assumption fails here rather than in a
  # user's AppImage.
  #
  # Sharded because the suite is ~570 files whose cost is dominated by per-file
  # module import rather than by the assertions, so it divides across runners
  # almost linearly. Three rather than two: `--shard` splits by file count, not
  # by duration, and at two the halves came in at 126s and 81s on macOS because
  # one of them drew the handful of filesystem-watcher suites that take seconds
  # apiece. A third shard costs nothing extra on the clock and spreads that tail.
  #
  # Not four or more, for two reasons. The install is a fixed cost that every
  # shard pays (Nix, the shell's closure, then `bun ci`), so the marginal gain shrinks
  # fast; and GitHub caps concurrent macOS runners far lower than Linux ones, so
  # a wide macOS fan-out starts queueing against any second run in flight —
  # which costs more wall clock than it saves.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Shard 1 of each OS is the one leg that saves the shell's Nix store, so
      # both runner platforms get a cache and no two legs race to upload one.
      - uses: ./.github/actions/nix-dev-shell
        with:
          save-nix-cache: ${{ matrix.shard == 1 }}
      # Sharding is a Vitest flag, so this runs the desktop app's suite directly
      # rather than the root fan-out, which would hand it to every workspace.
      # `nix develop` finds the flake by searching up from apps/desktop.
      - name: Vitest (shard ${{ matrix.shard }} of 3)
        working-directory: apps/desktop
        run: nix develop -c bun run test --shard=${{ matrix.shard }}/3

  scan:
    # `inputs` is null on push/pull_request, so those keep running the scan; only
    # a workflow_call passing false skips it.
    if: ${{ inputs.run_scan == null || inputs.run_scan }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scoped to this job rather than the workflow: a called workflow cannot hold
    # permissions its caller lacks, and release.yml has no use for these. It
    # still has to grant them on the calling job, because a called workflow's
    # job permissions are validated even when the job is skipped.
    permissions:
      contents: read
      # Sticky summary comment, inline review comments, and the PR file list.
      pull-requests: write
      # The commit status, which is the only place the score surfaces on a push
      # to master — the PR comment is skipped there.
      statuses: write
    steps:
      # Load-bearing for `scope: changed`: reaching the merge base is what lets
      # the scan report only what the PR introduced rather than every issue in
      # the changed files.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # These input names are the action's own and drifted once already — it
      # only *warns* on an unknown input, so `diff` / `github-token` /
      # `fail-on` / `verbose` silently fell back to defaults and the scan ran
      # advisory and unscoped. Check action.yml before editing.
      - uses: millionco/react-doctor@013f7373f91a3b9e68bd1dc7d4d354f4b041b117 # v2
        with:
          # The desktop app is the React project, and its doctor.config.jsonc
          # lives beside it rather than at the repository root.
          directory: apps/desktop
          scope: changed
          blocking: error

  # The flake's `master` output installs node_modules through one fixed-output
  # derivation whose hash is pinned in apps/desktop/nix/pins.json, and every bun.lock change
  # moves it. Building it here keeps a lockfile change from reaching master
  # without its pin, which would break `nix run …#master` until someone re-pinned.
  # The job runs on every PR so `verify` always sees a result, but only fetches
  # (about 1.2 GB) when the diff touches what the derivation is built from.
  nix-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Depth 2 reaches the PR merge commit's first parent, so the diff below is
      # exactly what the PR changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect a lockfile or flake change
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- bun.lock bunfig.toml flake.nix flake.lock apps/desktop/nix; then
            echo "deps=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        if: steps.changes.outputs.deps == 'true'

      - name: Build master.deps against apps/desktop/nix/pins.json
        if: steps.changes.outputs.deps == 'true'
        run: |
          if nix build .#master.deps --no-link 2>build.log; then
            exit 0
          fi
          cat build.log >&2
          got=$(sed -nE 's/.*got: +(sha256-[A-Za-z0-9+/]+=*).*/\1/p' build.log | tail -n1)
          if [ -n "$got" ]; then
            echo "::error file=apps/desktop/nix/pins.json::The Nix deps pin is stale. Run apps/desktop/nix/update-pins.sh deps on this branch, or set deps.x86_64-linux to $got."
            cat >>"$GITHUB_STEP_SUMMARY" <<EOF
          ### The Nix deps pin is stale

          Run \`apps/desktop/nix/update-pins.sh deps\` on this branch, or set \`deps.x86_64-linux\` in \`apps/desktop/nix/pins.json\` to:

          \`$got\`
          EOF
          fi
          exit 1

  # One status check named `verify`, whatever the jobs above grow to. The branch
  # ruleset lives in repository settings rather than in this tree, so a required
  # context can only be kept by keeping the name — renaming or dropping this job
  # would leave every PR blocked on a check that is never reported again.
  verify:
    needs: [lint, typecheck, test, nix-deps]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A job whose dependency failed is *skipped*, and a skipped required check
      # reports neutral rather than failing — which would make this aggregate
      # green on a red matrix. Read each result explicitly instead.
      - name: Fail unless every check passed
        if: >-
          needs.lint.result != 'success' || needs.typecheck.result != 'success'
          || needs.test.result != 'success' || needs.nix-deps.result != 'success'
        run: |
          echo "::error::lint=${{ needs.lint.result }} typecheck=${{ needs.typecheck.result }} test=${{ needs.test.result }} nix-deps=${{ needs.nix-deps.result }}"
          exit 1
