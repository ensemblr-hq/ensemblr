name: Checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:
    inputs:
      run_scan:
        description: >-
          Run the react-doctor scan. Callers building a tag pass false — the
          scan diffs against master, which a release tag already is.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # macOS, not ubuntu: `mod` resolves to ⌘ on darwin and Ctrl elsewhere, so the
  # keymap suites fail on Linux against an app that only ships for macOS.
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Biome, Tailwind scale, i18n lint, hardcoded strings
        run: npm run check

      - name: Type check
        run: npm run typecheck

      - name: Vitest
        run: npm run test

  scan:
    # `inputs` is null on push/pull_request, so those keep running the scan; only
    # a workflow_call passing false skips it.
    if: ${{ inputs.run_scan == null || inputs.run_scan }}
    runs-on: ubuntu-latest
    # Scoped to this job rather than the workflow: a called workflow cannot hold
    # permissions its caller lacks, and release.yml has no use for pull-requests.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: millionco/react-doctor@v2
        with:
          diff: master
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on: error
          verbose: "true"
