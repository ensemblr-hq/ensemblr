name: Release

# Cutting a release stays what it has always been: write the notes and run
# `gh release create vX.Y.Z --notes-file …`. That fires `published`, and this
# workflow builds the signed, notarized artifacts and attaches them. Pushing a
# bare tag deliberately does nothing — there would be no notes to attach to.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild, e.g. v0.1.0-beta.6
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  # On `release: published` this checks out the tag, because that event sets
  # github.ref to it. A manual dispatch checks out the branch it was dispatched
  # from instead — the escape-hatch path verifies the branch, not the tag.
  #
  # The reserved `nightly` tag is skipped: nightly.yml publishes its rolling
  # release out of a draft, which GitHub reports as `published` like any other.
  # Without this the first nightly starts a release build that can only fail, at
  # the package.json-matches-the-tag step. `github.event.release` is null on a
  # dispatch, so the escape hatch is unaffected.
  verify:
    if: ${{ !startsWith(github.event.release.tag_name, 'nightly') }}
    # Mirrors what checks.yml's `scan` job declares, because a called workflow's
    # job permissions are validated statically — a job skipped by `if:` is
    # validated too, so `run_scan: false` does not excuse the scope. Granted
    # here rather than at workflow level so `build`, which holds a Developer ID
    # private key, never carries them. Keep in step with that job.
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/checks.yml
    with:
      run_scan: false

  build:
    needs: verify
    # Pinned rather than macos-latest: an image bump must not silently change the
    # signing and notarization toolchain under a release.
    runs-on: macos-15
    # Notarization is a round trip to Apple and routinely takes several minutes
    # per artifact.
    timeout-minutes: 60
    # No secret is declared at job level: everything here is in scope for `npm
    # ci`, so a dependency lifecycle script would run with it in the
    # environment. `GH_TOKEN` carries `contents: write`, so it is injected into
    # each step that shells out to `gh` instead.
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Check the release exists and is published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          state=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo missing)
          case "$state" in
            false) ;;
            true)
              echo "::error::Release $TAG is still a draft. Publish it, then re-run."
              exit 1 ;;
            *)
              echo "::error::No GitHub Release for $TAG. Cut one with notes first: gh release create $TAG --notes-file NOTES.md"
              exit 1 ;;
          esac

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check package.json matches the tag
        run: |
          set -euo pipefail
          declared=$(node -p "require('./package.json').version")
          if [ "$declared" != "${TAG#v}" ]; then
            echo "::error::package.json version ($declared) does not match tag $TAG."
            exit 1
          fi

      - uses: ./.github/actions/apple-signing
        with:
          certificate-p12: ${{ secrets.APPLE_CERT_P12 }}
          certificate-password: ${{ secrets.APPLE_CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build the signed, notarized distributables
        env:
          ENSEMBLR_REQUIRE_SIGN: "1"
        run: npm run make

      - name: Verify every artifact is signed, notarized and stapled
        run: npm run verify:signing

      - name: Attach the distributables to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find out/make -type f \( -name '*.dmg' -o -name '*.zip' \) \
            > "$RUNNER_TEMP/assets.txt"
          tr '\n' '\0' < "$RUNNER_TEMP/assets.txt" \
            | xargs -0 gh release upload "$TAG" --clobber

      # Squirrel.Mac's feed document, read by the in-app updater
      # (src/main/updates/release-feed.ts). Two things make it worth a separate
      # asset rather than deriving the same facts in the app: it names the exact
      # version, so nothing has to parse a tag or a release body, and it points
      # at the `.zip` — Squirrel installs a zipped `.app` and cannot read a DMG.
      # The filename is a contract with UPDATE_FEED_ASSET_NAME; renaming one
      # without the other strands every installed build on its current version.
      - name: Attach the update feed document
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          zip=$(basename "$(grep '\.zip$' "$RUNNER_TEMP/assets.txt" | head -1)")
          feed="$RUNNER_TEMP/update-darwin-arm64.json"
          jq -n \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${zip}" \
            --arg name "${TAG#v}" \
            --arg notes "$(gh release view "$TAG" --json body -q .body)" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{url: $url, name: $name, notes: $notes, pub_date: $pub_date}' \
            > "$feed"
          gh release upload "$TAG" "$feed" --clobber

      - name: Set the prerelease flag from the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*) gh release edit "$TAG" --prerelease --latest=false ;;
            *) gh release edit "$TAG" --prerelease=false --latest ;;
          esac

      # Bumps ensemblr-hq/homebrew-tap so `brew install --cask
      # ensemblr-hq/tap/ensemblr` tracks the release without a hand edit
      # (THE-197). Three things worth knowing:
      #
      # - The sha256 is read off the asset's `digest`, which GitHub computes over
      #   what it actually stored. Re-hashing a local copy would only prove the
      #   upload round-tripped.
      # - The commit goes through the Contents API rather than a clone, so the
      #   token never reaches a git remote or `git config`.
      # - `release` only. A `workflow_dispatch` rebuild of an older tag must not
      #   walk the cask backwards, and the tap is the one artifact here that is
      #   not addressed by tag.
      #
      # Two tokens, and the split is the point. GITHUB_TOKEN reads this
      # repository's release; ENSEMBLR_TAP_TOKEN — a fine-grained PAT with
      # Contents: read and write on ensemblr-hq/homebrew-tap and nothing else —
      # only ever touches the tap. Neither can act where the other does, so the
      # PAT does not have to be widened to see a release, and a leak of it cannot
      # rewrite this repository. A missing or expired PAT fails this step
      # deliberately: the release is already published and intact by now, and a
      # silent warning would leave the tap quietly serving an old version.
      - name: Bump the Homebrew cask
        if: github.event_name == 'release'
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.ENSEMBLR_TAP_TOKEN }}
          TAP_REPOSITORY: ensemblr-hq/homebrew-tap
          CASK_PATH: Casks/ensemblr.rb
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::error::ENSEMBLR_TAP_TOKEN is not set, so the Homebrew cask cannot be bumped."
            exit 1
          fi

          version="${TAG#v}"
          dmg="Ensemblr-${version}-arm64.dmg"
          digest=$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq ".assets[] | select(.name == \"${dmg}\") | .digest")
          sha="${digest#sha256:}"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::No usable sha256 digest for $dmg (got '${digest:-nothing}')."
            exit 1
          fi

          export GH_TOKEN="$TAP_TOKEN"
          gh api "repos/${TAP_REPOSITORY}/contents/${CASK_PATH}" > "$RUNNER_TEMP/cask.json"
          blob=$(jq -r .sha "$RUNNER_TEMP/cask.json")
          jq -r .content "$RUNNER_TEMP/cask.json" | base64 --decode > "$RUNNER_TEMP/ensemblr.rb"

          if grep -q "^  version \"${version}\"$" "$RUNNER_TEMP/ensemblr.rb"; then
            echo "Cask is already at $version; nothing to push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sed -i '' \
            -e "s|^  version \".*\"$|  version \"${version}\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"${sha}\"|" \
            "$RUNNER_TEMP/ensemblr.rb"

          # Both lines must have moved. A silent no-op sed would otherwise push a
          # commit that changes nothing and leave the tap on the old version.
          grep -q "^  version \"${version}\"$" "$RUNNER_TEMP/ensemblr.rb"
          grep -q "^  sha256 \"${sha}\"$" "$RUNNER_TEMP/ensemblr.rb"

          gh api --method PUT "repos/${TAP_REPOSITORY}/contents/${CASK_PATH}" \
            -f "message=ensemblr ${version}" \
            -f "content=$(base64 < "$RUNNER_TEMP/ensemblr.rb" | tr -d '\n')" \
            -f "sha=${blob}" \
            --silent

          echo "Bumped \`${TAP_REPOSITORY}\` to \`${version}\`." >> "$GITHUB_STEP_SUMMARY"

      # The README's version line and .dmg link stay hand-edited; the exact asset
      # name is only known once make has run, so print it rather than guess.
      - name: Summarise the manual README edit
        run: |
          set -euo pipefail
          version="${TAG#v}"
          dmg=$(basename "$(grep '\.dmg$' "$RUNNER_TEMP/assets.txt" | head -1)")
          base="https://github.com/${GITHUB_REPOSITORY}/releases"
          {
            echo "### Published \`$TAG\`"
            echo
            echo "Attached:"
            while IFS= read -r asset; do echo "- \`$(basename "$asset")\`"; done \
              < "$RUNNER_TEMP/assets.txt"
            echo
            echo "README still needs these two lines by hand:"
            echo
            echo '```markdown'
            echo "- **Version:** [\`$version\`]($base/tag/$TAG) (pre-1.0, polish stage)"
            echo "**[Download Ensemblr $version (.dmg, Apple silicon)]($base/download/$TAG/$dmg)** — open it and drag Ensemblr to Applications."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          set -uo pipefail
          if [ -n "${ENSEMBLR_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$ENSEMBLR_SIGNING_KEYCHAIN" || true
          fi
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            rm -f "$APPLE_API_KEY_PATH"
          fi
