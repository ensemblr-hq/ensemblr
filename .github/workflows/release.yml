name: Release

# Cutting a release stays what it has always been: write the notes and run
# `gh release create vX.Y.Z --notes-file …`. That fires `published`, and this
# workflow builds the signed, notarized artifacts and attaches them. Pushing a
# bare tag deliberately does nothing — there would be no notes to attach to.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild, e.g. v0.1.0-beta.6
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  # Has the exact tree this release builds already been through Checks? A tag is
  # normally cut from a master commit that checks.yml has already run over in
  # full — and with the scan, which `verify` below skips — so re-running the same
  # suite over the same commit costs several minutes and proves nothing the first
  # run did not. This resolves the commit the way `build` does, by checking the
  # ref out, so a dispatch that rebuilds a branch is judged on that branch's head
  # rather than on whatever `github.sha` happens to be.
  #
  # It fails closed: a lookup that errors, finds nothing, or finds only failed
  # runs leaves `verified` false and the full suite runs. A tag cut from a commit
  # that never reached master is exactly that case.
  already-verified:
    if: ${{ !startsWith(github.event.release.tag_name, 'nightly') }}
    runs-on: ubuntu-latest
    # `actions: read` is what reads the run history, and it has to be asked for
    # by name: declaring any `permissions:` block at workflow level sets every
    # scope it does not list to none, so the workflow-level `contents: write`
    # leaves this job unable to list its own workflow's runs. Without it the
    # lookup 403s, falls back to `verified=false`, and quietly re-runs the suite
    # every time — the safe answer, but never the fast one.
    permissions:
      contents: read
      actions: read
    outputs:
      verified: ${{ steps.lookup.outputs.verified }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - id: lookup
        name: Look for a green Checks run on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          sha=$(git rev-parse HEAD)
          green=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/checks.yml/runs?head_sha=${sha}&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)
          case "$green" in
            ''|*[!0-9]*) green=0 ;;
          esac
          if [ "$green" -gt 0 ]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            echo "\`$sha\` already passed Checks ($green green run(s)); skipping re-verification." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "No green Checks run for \`$sha\`; running the full suite." >> "$GITHUB_STEP_SUMMARY"
          fi

  # On `release: published` this checks out the tag, because that event sets
  # github.ref to it. A manual dispatch checks out the branch it was dispatched
  # from instead — the escape-hatch path verifies the branch, not the tag.
  #
  # The reserved `nightly` tag is skipped: nightly.yml publishes its rolling
  # release out of a draft, which GitHub reports as `published` like any other.
  # Without this the first nightly starts a release build that can only fail, at
  # the package.json-matches-the-tag step. `github.event.release` is null on a
  # dispatch, so the escape hatch is unaffected.
  verify:
    needs: already-verified
    if: >-
      ${{ !startsWith(github.event.release.tag_name, 'nightly')
      && needs.already-verified.outputs.verified != 'true' }}
    # Mirrors what checks.yml's `scan` job declares, because a called workflow's
    # job permissions are validated statically — a job skipped by `if:` is
    # validated too, so `run_scan: false` does not excuse the scope. Granted
    # here rather than at workflow level so `build`, which holds a Developer ID
    # private key, never carries them. Keep in step with that job.
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/checks.yml
    with:
      run_scan: false

  build:
    # `verify` is now legitimately skipped when the commit was already checked,
    # and a skipped dependency skips the job that needs it — hence `always()`
    # plus explicit results. `skipped` and `success` both let the build through;
    # `failure` and `cancelled` do not. The nightly guard has to be repeated
    # here, because `always()` would otherwise run this on the one event the
    # whole workflow is meant to ignore.
    needs: [already-verified, verify]
    if: >-
      ${{ always()
      && !startsWith(github.event.release.tag_name, 'nightly')
      && needs.already-verified.result == 'success'
      && needs.verify.result != 'failure'
      && needs.verify.result != 'cancelled' }}
    # One leg per architecture, both on the same Apple silicon runner: Intel is
    # cross-built (`--arch=x64`). A native Intel runner would buy nothing but a
    # second migration — `macos-13` is retired and `macos-15-intel` sunsets in
    # August 2027. Not fail-fast: cancelling the other leg mid-notarization would
    # throw away minutes of a round trip to Apple for a failure that is not its.
    #
    # Each leg attaches only its own architecture's assets, and every name
    # carries the architecture, so the two never write the same asset. Nothing
    # that must happen once per release lives here — `finalize` owns that, after
    # it has checked that both legs delivered.
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    # Pinned rather than macos-latest: an image bump must not silently change the
    # signing and notarization toolchain under a release.
    runs-on: macos-15
    # Notarization is a round trip to Apple and routinely takes several minutes
    # per artifact.
    timeout-minutes: 60
    # No secret is declared at job level: everything here is in scope for `bun
    # ci`, so a dependency lifecycle script would run with it in the
    # environment. `GH_TOKEN` carries `contents: write`, so it is injected into
    # each step that shells out to `gh` instead.
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Check the release exists and is published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          state=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo missing)
          case "$state" in
            false) ;;
            true)
              echo "::error::Release $TAG is still a draft. Publish it, then re-run."
              exit 1 ;;
            *)
              echo "::error::No GitHub Release for $TAG. Cut one with notes first: gh release create $TAG --notes-file NOTES.md"
              exit 1 ;;
          esac

      - uses: ./.github/actions/install-dependencies

      - name: Check package.json matches the tag
        run: |
          set -euo pipefail
          declared=$(node -p "require('./package.json').version")
          if [ "$declared" != "${TAG#v}" ]; then
            echo "::error::package.json version ($declared) does not match tag $TAG."
            exit 1
          fi

      - uses: ./.github/actions/apple-signing
        with:
          certificate-p12: ${{ secrets.APPLE_CERT_P12 }}
          certificate-password: ${{ secrets.APPLE_CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}

      # Forge defaults to the host architecture, so `--arch` is what makes the x64
      # leg an Intel build rather than a second arm64 one.
      - name: Build the signed, notarized distributables
        env:
          ENSEMBLR_REQUIRE_SIGN: "1"
        run: bun run make --arch="$ARCH"

      - name: Verify every artifact is signed, notarized and stapled
        env:
          ENSEMBLR_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bun run verify:signing --arch="$ARCH"

      - name: Attach the distributables to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find out/make -type f \( -name '*.dmg' -o -name '*.zip' \) \
            > "$RUNNER_TEMP/assets.txt"
          dmg=$(bash .github/scripts/select-asset.sh "$RUNNER_TEMP/assets.txt" "-${ARCH}\.dmg\$")
          zip=$(bash .github/scripts/select-asset.sh "$RUNNER_TEMP/assets.txt" "/[^/]*-darwin-${ARCH}-[^/]*\.zip\$")
          gh release upload "$TAG" "$dmg" "$zip" --clobber

      # Squirrel.Mac's feed document, read by the in-app updater
      # (src/main/updates/release-feed.ts). Two things make it worth a separate
      # asset rather than deriving the same facts in the app: it names the exact
      # version, so nothing has to parse a tag or a release body, and it points
      # at the `.zip` — Squirrel installs a zipped `.app` and cannot read a DMG.
      # The filename is a contract with updateFeedAssetName(); renaming one
      # without the other strands every installed build on its current version.
      # `update-darwin-arm64.json` in particular keeps its exact name and shape
      # for good, because builds already installed read it by that name.
      #
      # The zip is picked by architecture, never "the first zip": one Intel
      # archive behind the arm64 document would install the wrong binary on every
      # Apple silicon Mac, and nothing in the app would notice.
      - name: Attach the update feed document
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          zip=$(basename "$(bash .github/scripts/select-asset.sh "$RUNNER_TEMP/assets.txt" "/[^/]*-darwin-${ARCH}-[^/]*\.zip\$")")
          feed="$RUNNER_TEMP/update-darwin-${ARCH}.json"
          jq -n \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${zip}" \
            --arg name "${TAG#v}" \
            --arg notes "$(gh release view "$TAG" --json body -q .body)" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{url: $url, name: $name, notes: $notes, pub_date: $pub_date}' \
            > "$feed"
          gh release upload "$TAG" "$feed" --clobber

      - name: Remove signing material
        if: always()
        run: |
          set -uo pipefail
          if [ -n "${ENSEMBLR_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$ENSEMBLR_SIGNING_KEYCHAIN" || true
          fi
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            rm -f "$APPLE_API_KEY_PATH"
          fi

  # Everything that must happen once per release rather than once per
  # architecture: the prerelease flag, the Homebrew cask and the README summary.
  # Each used to be a step at the end of `build`, which is only correct while
  # `build` is one job — with a matrix, the leg that finishes first would flip
  # the release public and bump the cask before the other one had delivered.
  #
  # Needs `build` alone. `build` is skipped for the reserved `nightly` tag and
  # whenever `verify` fails, and a skipped or failed dependency skips this job
  # too, so it carries no guard of its own.
  #
  # macOS, not Linux: the cask edit below uses BSD `sed -i ''`.
  finalize:
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      # By design the app shows no error for a release that lacks its feed
      # document — it reports "up to date". So an architecture whose leg was
      # skipped, half-uploaded or retried into a different release would be
      # stranded on its current version without anyone being told, and this is
      # the last place anything can notice. The feed is read back rather than
      # only listed: the document must name a zip built for its own architecture
      # and that zip must actually be on the release, which is what a wrong pick
      # would break.
      #
      # Keep the architecture list in step with the `build` matrix.
      - name: Check every architecture delivered before publishing anything
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          version="${TAG#v}"
          gh release view "$TAG" --json assets -q '.assets[].name' > "$RUNNER_TEMP/release-assets.txt"

          failures=0
          for arch in arm64 x64; do
            feed="update-darwin-${arch}.json"
            dmg="Ensemblr-${version}-${arch}.dmg"

            if ! grep -qxF "$dmg" "$RUNNER_TEMP/release-assets.txt"; then
              echo "::error::$TAG has no $dmg."
              failures=$((failures + 1))
            fi

            if ! grep -qxF "$feed" "$RUNNER_TEMP/release-assets.txt"; then
              echo "::error::$TAG has no $feed, so ${arch} Macs would silently stay on their current version."
              failures=$((failures + 1))
              continue
            fi

            url=$(gh release download "$TAG" --pattern "$feed" --output - | jq -r '.url // empty') || url=""
            zip="${url##*/}"
            case "$zip" in
              *-darwin-${arch}-*.zip) ;;
              *)
                echo "::error::$feed points at '${url:-nothing}', which is not an archive built for ${arch}."
                failures=$((failures + 1))
                continue ;;
            esac
            if ! grep -qxF "$zip" "$RUNNER_TEMP/release-assets.txt"; then
              echo "::error::$feed points at $zip, which $TAG does not carry."
              failures=$((failures + 1))
            fi
          done

          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures check(s) failed; leaving $TAG as it is. Re-run the failed build leg."
            exit 1
          fi

      - name: Set the prerelease flag from the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*) gh release edit "$TAG" --prerelease --latest=false ;;
            *) gh release edit "$TAG" --prerelease=false --latest ;;
          esac

      # The README's version line and .dmg links stay hand-edited; the asset
      # names are read off the release rather than guessed.
      - name: Summarise the manual README edit
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases"
          {
            echo "### Published \`$TAG\`"
            echo
            echo "Attached:"
            while IFS= read -r asset; do echo "- \`$asset\`"; done \
              < "$RUNNER_TEMP/release-assets.txt"
            echo
            echo "README still needs these lines by hand, and its platform table row for macOS no longer says Apple silicon only:"
            echo
            echo '```markdown'
            echo "- **Version:** [\`$version\`]($base/tag/$TAG) (pre-1.0, polish stage)"
            echo "**Download Ensemblr $version (.dmg): [Apple silicon]($base/download/$TAG/Ensemblr-${version}-arm64.dmg) · [Intel]($base/download/$TAG/Ensemblr-${version}-x64.dmg)** — open it and drag Ensemblr to Applications."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Bumps ensemblr-hq/homebrew-tap so `brew install --cask
      # ensemblr-hq/tap/ensemblr` tracks the release without a hand edit
      # (THE-197). Four things worth knowing:
      #
      # - The cask must already be in the two-architecture shape that
      #   docs/homebrew-cask-two-arch.md records — `arch arm:/intel:`, a
      #   two-line `sha256 arm:/intel:` and a `url` interpolating `#{arch}`. This
      #   step edits those lines and nothing else, and refuses any other shape
      #   rather than guess: a `sed` that matched nothing would push a commit
      #   that changes nothing and leave the tap on the old version. The tap has
      #   to be migrated before the first release that ships an x64 DMG.
      # - Both sha256 values are read off each asset's `digest`, which GitHub
      #   computes over what it actually stored. Re-hashing a local copy would
      #   only prove the upload round-tripped.
      # - The commit goes through the Contents API rather than a clone, so the
      #   token never reaches a git remote or `git config`.
      # - `release` only. A `workflow_dispatch` rebuild of an older tag must not
      #   walk the cask backwards, and the tap is the one artifact here that is
      #   not addressed by tag.
      #
      # Two tokens, and the split is the point. GITHUB_TOKEN reads this
      # repository's release; ENSEMBLR_TAP_TOKEN — a fine-grained PAT with
      # Contents: read and write on ensemblr-hq/homebrew-tap and nothing else —
      # only ever touches the tap. Neither can act where the other does, so the
      # PAT does not have to be widened to see a release, and a leak of it cannot
      # rewrite this repository. A missing or expired PAT fails this step
      # deliberately: the release is already published and intact by now, and a
      # silent warning would leave the tap quietly serving an old version.
      - name: Bump the Homebrew cask
        if: github.event_name == 'release'
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.ENSEMBLR_TAP_TOKEN }}
          TAP_REPOSITORY: ensemblr-hq/homebrew-tap
          CASK_PATH: Casks/ensemblr.rb
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::error::ENSEMBLR_TAP_TOKEN is not set, so the Homebrew cask cannot be bumped."
            exit 1
          fi

          version="${TAG#v}"

          digest_of() {
            local name="$1" digest sha
            digest=$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
              --jq ".assets[] | select(.name == \"${name}\") | .digest")
            sha="${digest#sha256:}"
            if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::No usable sha256 digest for $name (got '${digest:-nothing}')." >&2
              return 1
            fi
            printf '%s' "$sha"
          }
          sha_arm=$(digest_of "Ensemblr-${version}-arm64.dmg")
          sha_intel=$(digest_of "Ensemblr-${version}-x64.dmg")

          export GH_TOKEN="$TAP_TOKEN"
          cask="$RUNNER_TEMP/ensemblr.rb"
          gh api "repos/${TAP_REPOSITORY}/contents/${CASK_PATH}" > "$RUNNER_TEMP/cask.json"
          blob=$(jq -r .sha "$RUNNER_TEMP/cask.json")
          jq -r .content "$RUNNER_TEMP/cask.json" | base64 --decode > "$cask"

          two_arch_shape=(
            '^  arch arm: "arm64", intel: "x64"$'
            '^  version "[^"]*"$'
            '^  sha256 arm:   "[0-9a-f]{64}",$'
            '^         intel: "[0-9a-f]{64}"$'
            '^  url .*#\{arch\}'
          )
          for line in "${two_arch_shape[@]}"; do
            if ! grep -Eq -- "$line" "$cask"; then
              echo "::error::${CASK_PATH} in ${TAP_REPOSITORY} is not in the two-architecture shape (no line matching ${line}). Migrate it as docs/homebrew-cask-two-arch.md describes, then re-run this job."
              exit 1
            fi
          done

          cp "$cask" "$RUNNER_TEMP/ensemblr.rb.orig"
          sed -E -i '' \
            -e "s|^(  version )\"[^\"]*\"$|\1\"${version}\"|" \
            -e "s|^(  sha256 arm:   )\"[0-9a-f]{64}\",$|\1\"${sha_arm}\",|" \
            -e "s|^(         intel: )\"[0-9a-f]{64}\"$|\1\"${sha_intel}\"|" \
            "$cask"

          if cmp -s "$cask" "$RUNNER_TEMP/ensemblr.rb.orig"; then
            echo "Cask is already at $version with these checksums; nothing to push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # All three lines must have moved. A partial edit would otherwise push
          # a cask whose two architectures disagree about the version.
          grep -qxF "  version \"${version}\"" "$cask"
          grep -qxF "  sha256 arm:   \"${sha_arm}\"," "$cask"
          grep -qxF "         intel: \"${sha_intel}\"" "$cask"

          gh api --method PUT "repos/${TAP_REPOSITORY}/contents/${CASK_PATH}" \
            -f "message=ensemblr ${version}" \
            -f "content=$(base64 < "$cask" | tr -d '\n')" \
            -f "sha=${blob}" \
            --silent

          echo "Bumped \`${TAP_REPOSITORY}\` to \`${version}\`." >> "$GITHUB_STEP_SUMMARY"

  # A separate job rather than a matrix leg on `build`: nothing here is signed,
  # notarized or stapled, `verify:signing` looks only for `*-darwin-<arch>` output,
  # and the Apple signing action has no business running on a Linux runner. It
  # attaches to the same release, and `release-feed.ts` requires the `.AppImage`
  # to be present before it offers a Linux user the version.
  #
  # After `finalize`, not beside `build`. `release-feed.ts` offers a Linux user
  # any release carrying an `.AppImage`, and looks the darwin feed document up
  # before that gate — so a release that got the AppImage while notarization
  # failed would push Linux users at a version macOS users cannot install, and
  # hand them a hard error on the one release they could actually run. A failure
  # here still leaves the macOS release whole; the reverse must not happen.
  # `finalize` succeeding is what proves both Mac architectures delivered, and it
  # also inherits `build`'s "release exists and is published" guard, so this can
  # no longer attach to a draft.
  #
  # x64 ONLY, and that is a constraint, not a gap. Every already-shipped
  # linux-x64 client picks the first release asset whose name ends in
  # `.appimage` and checks no architecture, and those clients cannot be patched.
  # An arm64 AppImage on a release would be offered to them and installed over a
  # working x64 build. Linux arm64 therefore lands in a *later* release under a
  # name that deliberately does not end in `.appimage` —
  # `Ensemblr-<version>-linux-arm64.appimage.bin` — which those clients never
  # match. Do not add `arm64` to the matrix before that release.
  build-linux:
    # Same `always()` shape as `build`, for the same reason — `verify` is
    # skipped on an already-checked commit. Gating on `finalize` having actually
    # succeeded is what preserves the ordering the comment above describes.
    needs: [already-verified, verify, build, finalize]
    if: >-
      ${{ always()
      && !startsWith(github.event.release.tag_name, 'nightly')
      && needs.finalize.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      # `@reforged/maker-appimage` declares mksquashfs as a required external
      # binary and refuses to run without it; ubuntu-latest does not ship it.
      - name: Install mksquashfs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y squashfs-tools

      - uses: ./.github/actions/install-dependencies

      - name: Check package.json matches the tag
        run: |
          set -euo pipefail
          declared=$(node -p "require('./package.json').version")
          if [ "$declared" != "${TAG#v}" ]; then
            echo "::error::package.json version ($declared) does not match tag $TAG."
            exit 1
          fi

      - name: Build the AppImage
        env:
          ENSEMBLR_TARGET_ARCH: ${{ matrix.arch }}
        run: bun run make:linux --arch="$ARCH"

      # The AppImage goes up before its feed document, so the document never
      # names an asset that is not there yet.
      - name: Attach the AppImage and its update feed document to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find out/make -type f -name '*.AppImage' > "$RUNNER_TEMP/linux-assets.txt"
          appimage=$(bash .github/scripts/select-asset.sh "$RUNNER_TEMP/linux-assets.txt" "-${ARCH}\.AppImage\$")
          gh release upload "$TAG" "$appimage" --clobber

          feed="$RUNNER_TEMP/update-linux-${ARCH}.json"
          jq -n \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$appimage")" \
            --arg name "${TAG#v}" \
            --arg notes "$(gh release view "$TAG" --json body -q .body)" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{url: $url, name: $name, notes: $notes, pub_date: $pub_date}' \
            > "$feed"
          gh release upload "$TAG" "$feed" --clobber

          {
            echo "### Linux artifacts for \`$TAG\`"
            echo
            echo "- \`$(basename "$appimage")\`"
            echo "- \`$(basename "$feed")\`"
          } >> "$GITHUB_STEP_SUMMARY"
