name: Nightly

# A scheduled run always publishes; a manual one defaults `publish` to false, so
# the whole build path — macOS signing and the Linux AppImage alike — stays
# exercisable without touching the release list. Both build jobs are gated on
# the change gate only; `publish` gates the upload steps and the final job, so a
# dry run still proves that `make` and `make:linux` work.
# Building is change-gated below, so a quiet night costs one Linux job.
#
# 04:00 UTC puts a finished build in the release list before the working day in
# Europe. A published nightly outranks the newest `v<semver>` in /releases, so
# ensemblr.dev pins its two download links explicitly rather than reading
# whichever entry is newest.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the rolling `nightly` release (off = build and verify only)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Cheap and on Linux: deciding whether to build at all must not cost a macOS
  # runner. Compares master against the commit the `nightly` tag already points
  # at, so a quiet week republishes nothing. Never keys off timestamps.
  gate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      sha: ${{ steps.compare.outputs.sha }}
      short_sha: ${{ steps.compare.outputs.short_sha }}
      version: ${{ steps.compare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true

      - id: compare
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          short_sha=$(git rev-parse --short=7 HEAD)
          published=$(git rev-parse -q --verify refs/tags/nightly^{commit} || echo none)

          # The base contributes `<major>.<minor>.<patch>` only, never its own
          # prerelease tail. The in-app updater orders one nightly against the
          # next with `semver.gt`, and `0.1.0-beta.9-nightly.…` against
          # `0.1.0-beta.10-nightly.…` compares `9-nightly` to `10-nightly` as
          # *strings* — so the newer build would lose and every canary install
          # would report "up to date" for good. Stripped, the date is the first
          # identifier that can differ, and it orders numerically.
          #
          # `g` prefix: an all-digit short sha with a leading zero is an invalid
          # semver prerelease identifier, which git describe solves the same way.
          base=$(node -p "require('./package.json').version.split('-')[0]")
          echo "version=$base-nightly.$(date -u +%Y%m%d).g$short_sha" >> "$GITHUB_OUTPUT"
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

          if [ "$published" = "$head_sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change: master is still at \`$short_sha\`, which the current nightly already ships. Nothing built." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "master moved to \`$short_sha\` (nightly had \`$published\`). Building." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # Created here, once, rather than by whichever build leg gets there first:
      # the two macOS legs run in parallel, and both seeing "no release yet" would
      # race to create it — one `gh release create` then fails on the other's tag
      # and takes a good build down with it. Every job after this one only ever
      # uploads into a release that already exists.
      #
      # A draft, and a draft holds its tag unpushed until it is published. The
      # `nightly` tag is what the gate reads, so it moves only in `publish`, once
      # every asset is attached — moving it here would mark this commit published
      # while a build could still fail, and the next run would report "no change"
      # and never retry.
      - name: Create the rolling nightly draft if it does not exist yet
        if: >-
          steps.compare.outputs.changed == 'true' &&
          (github.event_name == 'schedule' || inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_SHA: ${{ steps.compare.outputs.sha }}
          NIGHTLY_VERSION: ${{ steps.compare.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view nightly > /dev/null 2>&1; then
            gh release create nightly --draft --target "$NIGHTLY_SHA" \
              --title "Ensemblr Nightly $NIGHTLY_VERSION" \
              --notes "Build in progress." --prerelease
          fi

  build:
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    # One leg per architecture, both on the same Apple silicon runner: Intel is
    # cross-built (`--arch=x64`), for the reasons release.yml gives. Not
    # fail-fast, so a dry run reports both architectures' failures at once.
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-15
    timeout-minutes: 60
    # No secret is declared at job level: everything here is in scope for `bun
    # ci`, so a dependency lifecycle script would run with it in the
    # environment. `GH_TOKEN` carries `contents: write`, so it is injected into
    # the one step that shells out to `gh` instead.
    #
    # The arm64 names are what already-installed canary builds fetch, so they
    # must stay byte-identical: `Ensemblr-Canary-arm64.dmg`,
    # `Ensemblr-Canary-darwin-arm64.zip` and `update-darwin-arm64.json`.
    env:
      NIGHTLY_SHA: ${{ needs.gate.outputs.sha }}
      NIGHTLY_VERSION: ${{ needs.gate.outputs.version }}
      ARCH: ${{ matrix.arch }}
      DMG_NAME: Ensemblr-Canary-${{ matrix.arch }}.dmg
      ZIP_NAME: Ensemblr-Canary-darwin-${{ matrix.arch }}.zip
      FEED_NAME: update-darwin-${{ matrix.arch }}.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}

      # Before the version stamp: `bun ci` requires package.json and the lockfile
      # to agree, and the stamp deliberately breaks that agreement.
      - uses: ./.github/actions/install-dependencies

      - name: Stamp the nightly version
        run: bun pm pkg set version="$NIGHTLY_VERSION"

      - uses: ./.github/actions/apple-signing
        with:
          certificate-p12: ${{ secrets.APPLE_CERT_P12 }}
          certificate-password: ${{ secrets.APPLE_CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}

      # Canary channel per ADR 0032: its own bundle id and product name, so an
      # installed nightly can never take over the release's Launch Services
      # registration. Notarized rather than merely signed — Gatekeeper blocks an
      # un-notarized build on every machine except the one that made it.
      - name: Build the signed, notarized canary
        env:
          ENSEMBLR_BUILD_CHANNEL: canary
          ENSEMBLR_REQUIRE_SIGN: "1"
        run: bun run make --arch="$ARCH"

      - name: Verify every artifact is signed, notarized and stapled
        env:
          ENSEMBLR_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bun run verify:signing --arch="$ARCH"

      # Fixed filenames: the canary product name contains a space, and a rolling
      # tag is only worth having if `--clobber` fully replaces yesterday's assets
      # and the download URL stays bookmarkable. Version and commit live in the
      # release body. Stapled tickets are inside the file, so renaming is safe.
      #
      # Each artifact is picked by architecture, never "the first one found": an
      # Intel archive behind the arm64 name would install the wrong binary on
      # every Apple silicon canary, and nothing would notice.
      - name: Rename artifacts to their stable nightly names
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nightly"
          find out/make -type f \( -name '*.dmg' -o -name '*.zip' \) > "$RUNNER_TEMP/built.txt"
          cp "$(bash .github/scripts/select-asset.sh "$RUNNER_TEMP/built.txt" "-${ARCH}\.dmg\$")" "$RUNNER_TEMP/nightly/$DMG_NAME"
          cp "$(bash .github/scripts/select-asset.sh "$RUNNER_TEMP/built.txt" "/[^/]*-darwin-${ARCH}-[^/]*\.zip\$")" "$RUNNER_TEMP/nightly/$ZIP_NAME"

      # Squirrel.Mac's feed document, read by the in-app updater
      # (src/main/updates/release-feed.ts). The rolling tag keeps the URL fixed,
      # so this document is the only thing that changes from one nightly to the
      # next — which is exactly why the app reads the version out of it rather
      # than off a tag that never moves. `$FEED_NAME` is a contract with
      # updateFeedAssetName().
      - name: Write the update feed document
        run: |
          set -euo pipefail
          jq -n \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/${ZIP_NAME}" \
            --arg name "$NIGHTLY_VERSION" \
            --arg notes "Automated build of master at ${NIGHTLY_SHA}." \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{url: $url, name: $name, notes: $notes, pub_date: $pub_date}' \
            > "$RUNNER_TEMP/nightly/$FEED_NAME"

      # Uploads only. Un-drafting the release and moving the `nightly` tag happen
      # in the `publish` job, after the AppImage is up too — the tag is what the
      # gate reads, so moving it here would mark this commit published while the
      # Linux leg could still fail, and the next run would report "no change" and
      # never retry. The release itself already exists: the `gate` job creates it
      # as a draft, so the legs never race to.
      - name: Upload the macOS assets to the rolling nightly
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload nightly \
            "$RUNNER_TEMP/nightly/$DMG_NAME" "$RUNNER_TEMP/nightly/$ZIP_NAME" \
            "$RUNNER_TEMP/nightly/$FEED_NAME" --clobber

      - name: Summarise the run
        if: always()
        run: |
          set -uo pipefail
          {
            echo "### Nightly \`$NIGHTLY_VERSION\` (macOS $ARCH)"
            echo
            echo "- Commit: \`$NIGHTLY_SHA\`"
            if [ "${{ github.event_name == 'schedule' || inputs.publish }}" = "true" ]; then
              echo "- Uploaded to the rolling \`nightly\` release."
            else
              echo "- Built and verified only; nothing uploaded (\`publish\` was off)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          set -uo pipefail
          if [ -n "${ENSEMBLR_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$ENSEMBLR_SIGNING_KEYCHAIN" || true
          fi
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            rm -f "$APPLE_API_KEY_PATH"
          fi

  # Runs beside `build` rather than after it: the `gate` job already created the
  # rolling release, so there is nothing here to wait for. Nothing here is signed
  # — an AppImage carries no notarization ticket — so `verify:signing`, which
  # looks only for `*-darwin-<arch>` output, is not run.
  #
  # Gated on the change gate alone, mirroring `build`: a `workflow_dispatch` with
  # `publish` off has to exercise `make:linux` too, or a break in it — a missing
  # icon size, a maker option, mksquashfs — passes every dry run and surfaces at
  # 04:00 UTC. The publish condition sits on the upload step instead.
  #
  # x64 ONLY, on purpose. Already-shipped linux-x64 clients pick the first
  # release asset ending in `.appimage` with no architecture check and cannot be
  # patched, so an arm64 AppImage on the rolling release would be installed over
  # a working x64 build. Linux arm64 arrives later under a name that does not end
  # in `.appimage`, as release.yml explains; do not add it to this matrix first.
  build-linux:
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            appimage: Ensemblr-Canary-x86_64.AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NIGHTLY_SHA: ${{ needs.gate.outputs.sha }}
      NIGHTLY_VERSION: ${{ needs.gate.outputs.version }}
      ARCH: ${{ matrix.arch }}
      APPIMAGE_NAME: ${{ matrix.appimage }}
      LINUX_FEED_NAME: update-linux-${{ matrix.arch }}.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}

      # `@reforged/maker-appimage` declares mksquashfs as a required external
      # binary and refuses to run without it; ubuntu-latest does not ship it.
      - name: Install mksquashfs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y squashfs-tools

      # Before the version stamp, for the same reason as the macOS job: `bun ci`
      # requires package.json and the lockfile to agree.
      - uses: ./.github/actions/install-dependencies

      - name: Stamp the nightly version
        run: bun pm pkg set version="$NIGHTLY_VERSION"

      - name: Build the canary AppImage
        env:
          ENSEMBLR_BUILD_CHANNEL: canary
          ENSEMBLR_TARGET_ARCH: ${{ matrix.arch }}
        run: bun run make:linux --arch="$ARCH"

      # Runs on a dry run too, so `publish: false` still proves the maker
      # produced something. Only the upload below is conditional.
      - name: Check the AppImage was produced
        run: |
          set -euo pipefail
          find out/make -type f -name '*.AppImage' > "$RUNNER_TEMP/built.txt"
          built=$(bash .github/scripts/select-asset.sh "$RUNNER_TEMP/built.txt" "-${ARCH}\.AppImage\$")
          cp "$built" "$RUNNER_TEMP/$APPIMAGE_NAME"

      # Fixed filename, matching the DMG and ZIP: the rolling tag is only worth
      # having if `--clobber` fully replaces yesterday's asset and the download
      # URL stays bookmarkable. The AppImage goes up before its feed document,
      # so the document never names an asset that is not there yet.
      - name: Attach the AppImage and its update feed document to the rolling nightly
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload nightly "$RUNNER_TEMP/$APPIMAGE_NAME" --clobber

          jq -n \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/${APPIMAGE_NAME}" \
            --arg name "$NIGHTLY_VERSION" \
            --arg notes "Automated build of master at ${NIGHTLY_SHA}." \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{url: $url, name: $name, notes: $notes, pub_date: $pub_date}' \
            > "$RUNNER_TEMP/$LINUX_FEED_NAME"
          gh release upload nightly "$RUNNER_TEMP/$LINUX_FEED_NAME" --clobber

          echo "Attached \`$APPIMAGE_NAME\` and \`$LINUX_FEED_NAME\` to the rolling nightly." \
            >> "$GITHUB_STEP_SUMMARY"

  # The barrier both build jobs publish through. The `nightly` tag is what the
  # gate reads, so it moves here and nowhere else: with it moving inside `build`,
  # a macOS build that succeeded and a Linux build that then failed left a
  # nightly with no AppImage, and the next run computed "no change" and never
  # retried it. Un-drafting is held back to the same point, so a first run's
  # release only becomes visible once every asset is attached.
  #
  # Residual, and deliberate: on a run after the first the release is already
  # published, so `build`'s `--clobber` upload replaces yesterday's macOS assets
  # before this job is reached. A failed Linux leg therefore leaves one nightly
  # pairing today's DMG with yesterday's AppImage — but the tag has not moved, so
  # the next run rebuilds and repairs it rather than skipping forever.
  publish:
    needs: [gate, build, build-linux]
    if: >-
      needs.gate.outputs.changed == 'true' &&
      (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NIGHTLY_SHA: ${{ needs.gate.outputs.sha }}
      NIGHTLY_VERSION: ${{ needs.gate.outputs.version }}
    steps:
      # The tag is force-moved to this commit, so the commit has to be here.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Publish the rolling nightly and move its tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Ensemblr Nightly $NIGHTLY_VERSION"
          notes=$(printf '%s\n' \
            "Automated build of \`master\`. Not a release — see the \`v*\` tags for those." \
            "" \
            "- Version: \`$NIGHTLY_VERSION\`" \
            "- Commit: $NIGHTLY_SHA" \
            "- Channel: canary (installs as \"Ensemblr Canary\", alongside a release)")

          gh release edit nightly --title "$title" --notes "$notes" \
            --prerelease --latest=false --draft=false

          git tag -f nightly "$NIGHTLY_SHA"
          git push -f origin refs/tags/nightly

          echo "Published the rolling nightly at \`$NIGHTLY_VERSION\`." \
            >> "$GITHUB_STEP_SUMMARY"
