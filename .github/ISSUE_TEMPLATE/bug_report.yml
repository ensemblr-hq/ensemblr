name: Bug report
description: Something in Ensemblr behaves incorrectly.
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities do **not** belong here — see [SECURITY.md](../blob/master/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Ensemblr version
      description: Ensemblr → About, or the version in `package.json` if you built from source.
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: Build channel
      description: Channels have separate bundle ids and separate data, so this matters.
      options:
        - release
        - canary
        - dev
        - built from source (unsigned)
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: "15.3, M2 Pro"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Which agent runtime was involved
      options:
        - Pi
        - Claude Code
        - A terminal harness (Codex, Vibe, claude TUI)
        - None — this is not agent-related
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      description: Output of `pi --version` or `claude --version`, if relevant.

  - type: dropdown
    id: fresh-workspace
    attributes:
      label: Does it reproduce in a fresh workspace?
      options:
        - "Yes"
        - "No"
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Setup diagnostics
      description: Settings → More → Diagnostics. Paste the rollup if any check is not green.
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: text
