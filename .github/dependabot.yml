version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # React and react-dom ship from one repository on one version, and
      # @types/react-dom peer-depends on @types/react, so a bump landing one
      # without the other fails the install. All four only ever move together.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # Electron carries the Chromium and Node the app runs on, so a patch
      # release is a security update. Grouped alone so it is never buried in a
      # batched dev-dependency pull request nobody reads line by line.
      electron:
        patterns:
          - electron
          - "@electron/*"
          - "@electron-forge/*"
      # @lexical/react pins its own nested copy of lexical, so bumping one
      # without the other leaves two copies in the tree — and two structurally
      # identical but nominally distinct EditorState types, which fails
      # typecheck. They only ever move together.
      lexical:
        patterns:
          - lexical
          - "@lexical/*"
      # @tanstack/react-router and @tanstack/router-plugin each pin an exact
      # @tanstack/router-core, and every release moves that pin. The plugin is a
      # development dependency and the router is not, so ungrouped they arrive
      # in different pull requests and leave two router-cores in the tree.
      tanstack-router:
        patterns:
          - "@tanstack/react-router*"
          - "@tanstack/router-*"
      # A group without `applies-to` covers version updates only, so an advisory
      # on one of these families would still arrive as one pull request per
      # package — which for lexical and react is the split this file exists to
      # prevent. Each family gets a security twin; none bundles anything outside
      # itself, so no advisory waits on an unrelated package.
      electron-security:
        applies-to: security-updates
        patterns:
          - electron
          - "@electron/*"
          - "@electron-forge/*"
      lexical-security:
        applies-to: security-updates
        patterns:
          - lexical
          - "@lexical/*"
      react-security:
        applies-to: security-updates
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      tanstack-router-security:
        applies-to: security-updates
        patterns:
          - "@tanstack/react-router*"
          - "@tanstack/router-*"
      # The two @types packages and @tanstack/router-plugin are development
      # dependencies, so this group would claim them back out of their families
      # and split each across two pull requests again. Dependabot hands an
      # update to the first group in this file that matches it, but the entries
      # below declare the overlap rather than leaning on that ordering.
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - electron
          - "@electron/*"
          - "@electron-forge/*"
          - "@types/react"
          - "@types/react-dom"
          - "@tanstack/react-router*"
          - "@tanstack/router-*"
    ignore:
      # @types/node mirrors the Node major that Electron embeds (24), not the
      # latest release; a newer major type-checks green and fails at runtime.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
