version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Electron carries the Chromium and Node the app runs on, so a patch
      # release is a security update. Grouped alone so it is never buried in a
      # batched dev-dependency pull request nobody reads line by line.
      electron:
        patterns:
          - electron
          - "@electron/*"
          - "@electron-forge/*"
      # @lexical/react pins its own nested copy of lexical, so bumping one
      # without the other leaves two copies in the tree — and two structurally
      # identical but nominally distinct EditorState types, which fails
      # typecheck. They only ever move together.
      lexical:
        patterns:
          - lexical
          - "@lexical/*"
      # A group without `applies-to` covers version updates only, so an advisory
      # on either family would still arrive as one pull request per package —
      # which for lexical is the split this file exists to prevent. Each family
      # gets a security twin; neither bundles anything outside itself, so no
      # advisory waits on an unrelated package.
      electron-security:
        applies-to: security-updates
        patterns:
          - electron
          - "@electron/*"
          - "@electron-forge/*"
      lexical-security:
        applies-to: security-updates
        patterns:
          - lexical
          - "@lexical/*"
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - electron
          - "@electron/*"
          - "@electron-forge/*"
    ignore:
      # @types/node mirrors the Node major that Electron embeds (24), not the
      # latest release; a newer major type-checks green and fails at runtime.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
