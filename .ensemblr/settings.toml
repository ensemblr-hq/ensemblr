#:schema ../apps/desktop/schemas/settings.schema.json

# Every command runs inside the flake's dev shell (apps/desktop/nix/dev-shell.nix),
# which puts Node, Bun, and the native-module toolchain first on PATH. That makes
# the result independent of whatever the login-shell PATH Ensemblr captured has
# in front. Never add PATH to [environment_variables]: the resolver is gated on
# the key being absent, so configuring one silently disables it.
#
# The install is the monorepo's and runs at the repository root; every run
# script below belongs to the desktop app, so each one runs from apps/desktop.
[scripts]
setup = "nix develop -c bun ci"

# Electron dev server.
[scripts.run.dev]
command = "nix develop -c bun run --cwd apps/desktop dev"
icon = "play"
default = true
available_in = ["local"]

[scripts.run.checks]
command = "nix develop -c sh -c 'bun run check && bun run typecheck'"
icon = "list-checks"
available_in = ["local"]

[scripts.run.test]
command = "nix develop -c bun run --cwd apps/desktop test"
icon = "test-tube"
available_in = ["local"]

[scripts.run.playground]
command = "nix develop -c bun run --cwd apps/desktop dev:playground"
icon = "play"
available_in = ["local"]

# Screenshot host: a second Electron entrypoint rendering the real UI over
# scripted fixtures. See apps/desktop/demo/README.md. Never touches the app's own state.
[scripts.run.demo]
command = "nix develop -c bun run --cwd apps/desktop dev:demo"
icon = "monitor"
available_in = ["local"]

# macOS artifact. `make:unsigned` builds for the host architecture and `open`
# is macOS-only, so this one does nothing useful on a Linux host — build
# `appimage` there.
[scripts.run.unsigned]
command = "nix develop -c bun run --cwd apps/desktop make:unsigned && open apps/desktop/out"
icon = "package"
available_in = ["local"]

# Linux artifact, built for the host architecture. For local testing only: the
# shell compiles node-pty against Nix's glibc, so this AppImage's terminals work
# only where that glibc exists. The release AppImage is built by CI.
[scripts.run.appimage]
command = "nix develop -c bun run --cwd apps/desktop make:linux"
icon = "package"
available_in = ["local"]
