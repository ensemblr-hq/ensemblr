#:schema ../schemas/settings.schema.json

# Node 24 is pinned by scripts/require-node-version.mjs. Setup and run scripts
# spawn through a non-interactive shell that never activates mise on its own,
# so Ensemblr injects the workspace directory's login-shell PATH instead — that
# capture evaluates this repo's mise.toml and puts Node 24 and Bun on PATH.
# Never add PATH to [environment_variables]: the resolver is gated on the key
# being absent, so configuring one silently disables it and the commands below
# fall back to whatever Node is first on the app's inherited PATH.
[scripts]
setup = "bun ci"

# Electron dev server.
[scripts.run.dev]
command = "bun run dev"
icon = "play"
default = true
available_in = ["local"]

[scripts.run.checks]
command = "bun run check && bun run typecheck"
icon = "list-checks"
available_in = ["local"]

[scripts.run.test]
command = "bun run test"
icon = "test-tube"
available_in = ["local"]

[scripts.run.playground]
command = "bun run dev:playground"
icon = "play"
available_in = ["local"]

# Screenshot host: a second Electron entrypoint rendering the real UI over
# scripted fixtures. See demo/README.md. Never touches the app's own state.
[scripts.run.demo]
command = "bun run dev:demo"
icon = "monitor"
available_in = ["local"]

# macOS artifact. `make:unsigned` builds for the host architecture and `open`
# is macOS-only, so this one does nothing useful on a Linux host — build
# `appimage` there.
[scripts.run.unsigned]
command = "bun run make:unsigned && open out"
icon = "package"
available_in = ["local"]

# Linux artifact, built for the host architecture. Needs mksquashfs;
# `diagnose` reports whether this host has it.
[scripts.run.appimage]
command = "bun run make:linux"
icon = "package"
available_in = ["local"]

# Read-only: compiler, make, python3, mksquashfs, and what pty.node linked
# against. Never builds, so it always describes the tree as it stands.
[scripts.run.diagnose]
command = "bun run diagnose:linux"
icon = "microscope"
available_in = ["local"]

# Rebuilds node-pty in a throwaway Debian container. `dev` does this by itself
# when the binding is missing or stamped for the wrong Electron ABI; this is for
# replacing one without waiting for a preflight to notice.
[scripts.run.rebuild-native]
command = "bun run rebuild:native"
icon = "hammer"
available_in = ["local"]
